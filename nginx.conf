# ============================================================
# 数字花园 Nginx 反向代理与 HTTPS 配置示例
# 部署位置：/etc/nginx/sites-available/garden.conf
# 启用方式：sudo ln -s /etc/nginx/sites-available/garden.conf /etc/nginx/sites-enabled/
# 替换项：your-garden-domain.com → 实际域名；证书由 certbot 生成
# 校验：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-garden-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-garden-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-garden-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-garden-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 批量导入：单文件上限 5 MB（spec 9.2），留出 multipart 编码开销后按 8m 放行。
    # nginx 默认上限是 1 MB，不加这条 5 MB 的文件会被 nginx 直接以 413 挡回、请求到不了 Nuxt。
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
