# ============================================================
# 本地 Docker 演示编排（应用容器化，数据库复用本机 PostgreSQL）
# 使用：docker compose -f docker-compose.local.yml up -d --build
# 访问：http://localhost:3000  |  停止：docker compose -f docker-compose.local.yml down
# ============================================================

services:
  app:
    build: .
    container_name: garden-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:a82711045@host.docker.internal:5432/digital_garden?schema=public
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
    ports:
      - "3000:3000"
    volumes:
      # vault 与本地共享：容器内新增/修改笔记与本地文件系统实时互通
      - ./content/vault:/app/content/vault
